<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy cập bị từ chối - News Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row">
            <div class="col-md-12 text-center">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <i class="fas fa-exclamation-triangle text-danger mb-4" style="font-size: 5rem;"></i>
                        <h1 class="display-4 text-danger mb-3">403</h1>
                        <h2 class="h4 mb-3">Truy cập bị từ chối</h2>
                        <p class="text-muted mb-4">
                            Bạn không có quyền truy cập vào trang này.
                            Chỉ có quản trị viên mới được phép truy cập khu vực quản lý.
                        </p>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <a href="/" class="btn btn-primary me-md-2">
                                <i class="fas fa-home me-2"></i>Về trang chủ
                            </a>
                            <a href="/login" class="btn btn-outline-secondary">
                                <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                            </a>
                        </div>
                        <div class="mt-4">
                            <p class="text-muted small">
                                Nếu bạn tin rằng đây là lỗi, vui lòng liên hệ với quản trị viên.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
