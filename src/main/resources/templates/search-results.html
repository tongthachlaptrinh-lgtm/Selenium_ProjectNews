<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="layout :: layout(~{::content})">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'News Portal'">News Portal</title>

    <!-- Additional styles specific to search results -->
    <style>
        h1 {
            color: #2a7;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #333;
        }
        .card-content p {
            color: #666;
            font-size: 14px;
        }
        .no-results {
            color: #888;
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- Main Content -->
<div th:fragment="content" class="container my-4">
    <h1>Kết quả tìm kiếm cho "<span th:text="${keyword}">keyword</span>"</h1>

    <div class="results" th:if="${results != null and !results.content.isEmpty()}">
        <div class="card" th:each="item : ${results.content}">
            <a th:href="@{'/news/' + ${item.id}}">
                <img th:src="${item.imageUrl}" alt="Ảnh tin tức">
                <div class="card-content">
                    <h3 th:text="${item.title}">Tiêu đề</h3>
                    <!-- Nếu có summary thì dùng summary, nếu không thì rút gọn content -->
                    <p th:text="${item.summary != null ? item.summary : #strings.abbreviate(item.content, 150)}">Tóm tắt</p>
                    <p style="font-size: 12px; color: #aaa;" th:text="${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
                </div>
            </a>
        </div>
    </div>

    <p class="no-results" th:if="${results == null or results.content.isEmpty()}">
        Không tìm thấy kết quả nào cho từ khóa "<span th:text="${keyword}">keyword</span>".
    </p>
</div>

</body>
</html>
