<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'News Portal'">News Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .news-card {
            transition: transform 0.3s ease;
            height: 100%;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .news-image {
            height: 200px;
            object-fit: cover;
        }
        .sidebar {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }
        .footer {
            background: #343a40;
            color: white;
            margin-top: 50px;
        }
        .search-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }
        h1 {
            color: #2a7;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #333;
        }
        .card-content p {
            color: #666;
            font-size: 14px;
        }
        .no-results {
            color: #888;
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div th:replace="layout :: layout">

<!-- Main Content -->
<main th:fragment="content">
    <h1>Kết quả tìm kiếm cho "<span th:text="${keyword}">keyword</span>"</h1>

    <div class="results" th:if="${results != null and !results.content.isEmpty()}">
        <div class="card" th:each="item : ${results.content}">
            <a th:href="@{'/news/' + ${item.id}}">
            <img th:src="${item.imageUrl}" alt="Ảnh tin tức">
            <div class="card-content">
                <h3 th:text="${item.title}">Tiêu đề</h3>
                <!-- Nếu có summary thì dùng summary, nếu không thì rút gọn content -->
                <p th:text="${item.summary != null ? item.summary : #strings.abbreviate(item.content, 150)}">Tóm tắt</p>
                <p style="font-size: 12px; color: #aaa;" th:text="${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
            </div>
            </a>
        </div>
    </div>

    <p class="no-results" th:if="${results == null or results.content.isEmpty()}">
        Không tìm thấy kết quả nào cho từ khóa "<span th:text="${keyword}">keyword</span>".
    </p>

    <!-- Content will be inserted here -->
</main>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script>
    // Auto-hide alerts after 5 seconds
    setTimeout(function() {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(function(alert) {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        });
    }, 5000);
</script>
</body>
</html>
